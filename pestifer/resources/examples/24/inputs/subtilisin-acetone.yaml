# Author: Cameron F. Abrams, <cfa22@drexel.edu>
title: Subtilisin Carlsberg in acetone
psfgen:
  aliases:
    residue: ["CA CAL"]
    atom: ["CAL CA CAL"]
tasks:
- fetch:
    sourceID: 1scd
    source_format: pdb
- psfgen:
    source:
      biological_assembly: 1
- md:
    ensemble: minimize
- solvate:
    solvent: ACO
- md:
    ensemble: minimize
- md:
    ensemble: nvt
- density_equilibrate:
    # Acetone decorrelates slowly (autocorrelation time 15-23 frames, against a median of
    # about 6 across the other examples), so the running mean's standard error shrinks too
    # slowly to pass the precision gate inside the default ceiling.  A 2026-08 sweep had all
    # three replicas stop on CEILING at 100000; at 250000 two of three converged (115000 and
    # 227000 steps) but the 3.22.1 sweep's third stopped at the 250000 ceiling with its drift
    # already inside tolerance (0.0013) and only the precision gate unmet -- i.e. short of
    # sampling, not unsettled.  227000 is close enough to 250000 that the margin was the
    # problem, so this is doubled rather than nudged.
    max_steps: 500000
- mdplot:
    basename: solvated
    grid: true
    timeseries:
    - - a_x
      - b_y
      - c_z
- terminate:
    basename: my_1scd_aco
    package:
      basename: prod_1scd_aco
      namd:
        ensemble: NPT
