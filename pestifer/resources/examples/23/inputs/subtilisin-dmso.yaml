title: Subtilisin Carlsberg in DMSO
psfgen:
  aliases:
    residue: ["CA CAL"]
    atom: ["CAL CA CAL"]
tasks:
- fetch:
    sourceID: 1scd
    source_format: pdb
- psfgen:
    source:
      biological_assembly: 1
- md:
    ensemble: minimize
- solvate:
    solvent: DMSO
- md:
    ensemble: minimize
- md:
    ensemble: nvt
- density_equilibrate:
- mdplot:
    basename: solvated
    grid: true
    timeseries:
    - - a_x
      - b_y
      - c_z
- terminate:
    basename: my_1scd_dmso
    package:
      basename: prod_1scd_dmso
      namd:
        ensemble: NPT