# Author: Cameron F. Abrams, <cfa22@drexel.edu>
title: Asymmetric GroEL/GroES Chaperonin Complex
tasks:
- fetch:
    sourceID: 1aon
- psfgen:
    source:
      biological_assembly: 1
- validate:
    tests:
    - residue_test:
        name: ADPs are present
        selection: resname ADP
        measure: residue_count
        value: 7
- md:
    ensemble: minimize
- solvate:
    salt_con: 0.15
- md:
    ensemble: minimize
- md:
    ensemble: NVT
- density_equilibrate:
- mdplot:
    basename: solvated
    grid: true
    timeseries:
    - - a_x
      - b_y
      - c_z
- terminate:
    basename: my_1aon
    package:
      basename: my_1aon
      namd:
        ensemble: NPT
