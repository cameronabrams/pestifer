# Author: Cameron F. Abrams, <cfa22@drexel.edu>
#
# pestifer input script
#
# Membrane-embedded build of HIV-1 gp41 MPER-TM trimer (6e8w)
#
# The DMPC bilayer is built with the grid packer, which places lipids on a
# lattice directly and sizes the membrane to the protein footprint.
#
# NOTE: This example uses NAMD's on-the-fly pressureProfile calculation in the
# post-equilibration NPgT stage and in the packaged production run. CUDA-enabled
# (GPU) NAMD does not support pressureProfile, so this example must be run with
# a CPU NAMD build. Remove the `pressureProfile*` keys from the relevant
# `other_parameters` blocks (or omit `--gpu`) to use a GPU build.
#
title: HIV-1 gp41 MPER-TM trimer 6e8w embedded in DMPC bilayer (grid packer)
tasks:
  - fetch:
      sourceID: 6e8w
  - psfgen:
      source:
        model: 15 # last frame
  - md:
      cpu-override: True
      ensemble: minimize
  - make_membrane_system:
      bilayer:
        packer: grid
        salt_con: 0.154
        cation: POT
        anion: CLA
        SAPL: 60.0
        composition:
          lower_leaflet:
            - name: DMPC
              frac: 1.00
          upper_leaflet:
            - name: DMPC
              frac: 1.00
        seed: 270272
        relaxation_protocols:
          # Strategy (2026-07-30, after the minimize-only trial was rejected): pre-equilibrate the
          # pristine gridded membrane (density + lateral area, tensionless NPgT) BEFORE embedding.
          # The minimize-only alternative left the ASSEMBLED system at ~0.795 g/cc; that huge post-embed
          # compaction never cleared the density drift gate (a long slow tail, with the lateral area
          # co-compacting metastably low and only slowly recovering). Pre-equilibrating here starts the
          # single post-embed membrane_equilibrate near density-equilibrium (~0.96, denser still once M5's
          # bulk-density water is added), which is what keeps that run convergeable.
          quilt:
            - md:
                ensemble: minimize
            - md:
                ensemble: NVT
                nsteps: 1000
                temperature: 310
            - membrane_equilibrate:
                temperature: 310
      embed:
        xydist: 40
        zdist: 10
        z_head_group: "protein and resid 667"
        z_tail_group: "protein and resid 710"
        z_ref_group: 
          text: "protein and resid 696"
          z_value: 0.0
  - validate:
      tests:
        - residue_test:
            name: test of protein presence
            selection: protein
            measure: residue_count
            relation: '>='
            value: 1
  - md:
      ensemble: minimize
      minimize: 1000
      constraints:
        k: 10
        atoms: protein and name CA
  # --- post-embed equilibration ---
  # A brief warm pass fluidizes the lipids around the freshly-embedded protein; a
  # self-terminating membrane_equilibrate task then condenses out the embedding
  # voids and relaxes the lateral area under tensionless NPgT, stopping once both
  # the box density and the lateral area have converged (replacing the old fixed
  # NPT-condense + NPgT-area ladder). Weak CA restraints hold the protein steady
  # while the box relaxes and are released only on the final stage, on which the
  # pressure profile is computed.
  - md:
      ensemble: NVT
      nsteps: 1000
      temperature: 410
      constraints:
        k: 10
        atoms: protein and name CA
  - md:
      ensemble: NVT
      nsteps: 4000
      temperature: 310
      constraints:
        k: 1
        atoms: protein and name CA
  # A single self-terminating membrane_equilibrate task replaces the restrained NPT-condense +
  # NPgT-area-relax ladder: chunked NPgT (useFlexibleCell + useConstantRatio, tensionless) sized so the
  # condensing cell never outruns NAMD's startup patch grid, stopping when the box density AND the
  # membrane lateral area have both converged. Weak CA restraints hold the protein while the box relaxes.
  - membrane_equilibrate:
      temperature: 310
      # Post-embed needs a larger ceiling than the schema default (500k): inserting the protein
      # perturbs the preferred area, and the density compaction (from the ~0.95 assembled start) and
      # the ensuing ~3% lateral-area expansion relax *sequentially*, so density converges first
      # (~1 ns) and the slow lipid area mode needs several 100k more. 500k ceilinged with the area
      # ~97% relaxed; 800k lets it finish. (The bare-bilayer quilt, unperturbed, converges by ~84k.)
      max_steps: 800000
      constraints:
        k: 1
        atoms: protein and name CA
  # Restraints are off from here on.  The stage above certifies convergence of the *restrained*
  # system; releasing the restraints changes the ensemble, and a profile must be sampled in the
  # ensemble that was actually equilibrated.  Without this stage the 256 ps sampling window below
  # did double duty as the re-equilibration, ungated -- and the lateral area was still moving
  # through all of it (+2.1 to -3.3 %/ns, a 1.3-2.7% total contraction).  Gate on the cumulative area
  # PLATEAU as well as the local slope: the local gate can certify while a slow systematic descent
  # continues, which is exactly the failure this closes.
  #
  # Which mechanism dominates -- shock from releasing the (already weak, k=1) restraint, or the slow
  # lipid-area mode simply needing longer than any stage above allowed -- is NOT established; both
  # predict what was measured.  This stage is robust to either, and doubles as the experiment: a
  # quick settle indicts the release, a long one indicts the slow mode.
  - membrane_equilibrate:
      temperature: 310
      max_steps: 800000
      area_plateau_tol: 0.005
  - md:
      # profile-sampling stage only: 256 ps on the cell the unrestrained stage above certified.
      # This window no longer doubles as the equilibration -- it must not, since nothing gates it.
      ensemble: NPgT
      nsteps: 128000
      temperature: 310
      other_parameters:
        # These profiles OMIT the PME reciprocal-space term: NAMD computes "kinetic, bonded and
        # nonbonded (but not reciprocal space) contributions" unless pressureProfileEwald is set.
        # The omission is deliberate, not an oversight, and it is not small -- the reciprocal term
        # can flip the sign of the integral (real-space -16.63, reciprocal +26.50, summed +9.87
        # mN/m on one ex16 replica).
        # pressureProfileEwald is NOT set because NAMD registers ComputeEwald as an ordinary
        # compute and gates it only on doFullElectrostatics -- never on pressureProfileFreq -- so
        # it runs every full-electrostatics step. Measured 2026-08-31 at 14-28x the per-step cost,
        # which turns this 128000-step stage into 5-11 days per replica.
        # To get the complete profile, replay the trajectory offline with `pestifer
        # pressure-profile-ewald`, which runs both passes and sums them, and self-checks the
        # sum against NAMD's own reported pressure.
        # Never substitute one contribution for the other.
        pressureProfile: on
        pressureProfileFreq: 100
        pressureProfileSlabs: 20
  - mdplot:
      timeseries:
        - - cpu_time
          - wall_time
        - - a_x
          - b_y
          - c_z
      profiles:
        - pressure
      basename: bilayer
      grid: True
      legend: True
  - terminate:
      basename: my_6e8w
      package:
        basename: prod_6e8w
        namd:
          ensemble: NPgT
          firsttimestep: 0
          dcdfreq: 10000
          xstfreq: 10000
          outputenergies: 1000
          nsteps: 10000000
          other_parameters:
            # As in the sampling stage above, these profiles OMIT the PME reciprocal-space term --
            # NAMD computes "kinetic, bonded and nonbonded (but not reciprocal space) contributions"
            # unless pressureProfileEwald is set. Deliberate, and not small: the reciprocal term can
            # flip the sign of the integral (real-space -16.63, reciprocal +26.50, summed +9.87 mN/m
            # on one ex16 replica).
            # pressureProfileEwald is NOT set because NAMD registers ComputeEwald as an ordinary
            # compute and gates it only on doFullElectrostatics -- never on pressureProfileFreq -- so
            # it runs every full-electrostatics step, measured 2026-08-31 at 14-28x the per-step cost.
            # At the nsteps below that is prohibitive by orders of magnitude.
            # To get the complete profile, replay the trajectory offline with `pestifer
            # pressure-profile-ewald`, which runs both passes and sums them, and self-checks the
            # sum against NAMD's own reported pressure.
            # Never substitute one contribution for the other.
            pressureProfile: on
            pressureProfileFreq: 10000 # must equal xstfreq!
            pressureProfileSlabs: 20
