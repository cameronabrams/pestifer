# Author: Cameron F. Abrams, <cfa22@drexel.edu>
#
# pestifer input script
#
# Membrane-embedded build of HIV-1 gp41 MPER-TM trimer (6e8w)
#
# The asymmetric viral bilayer is built with the grid packer: two symmetric
# calibration patches (one per leaflet composition) are relaxed to measure each
# leaflet's preferred area-per-lipid, then the membrane is gridded directly at
# stress-free per-leaflet counts and sized to the protein footprint.
#
# NOTE: This example uses NAMD's on-the-fly pressureProfile calculation in the
# post-equilibration NPgT stage and the packaged production run. CUDA-enabled
# (GPU) NAMD does not support pressureProfile, so this example must be run with a
# CPU NAMD build. Remove the `pressureProfile*` keys to use a GPU build.
#
title: HIV-1 gp41 MPER-TM trimer 6e8w embedded in model viral bilayer (grid packer)
tasks:
  - fetch:
      sourceID: 6e8w
  - psfgen:
      source:
        model: 15 # last frame
  - md:
      cpu-override: True
      ensemble: minimize
  - make_membrane_system:
      bilayer:
        packer: grid
        # Both leaflets are ~43-47% cholesterol (stress-free APL ~47.6, measured), so seed the grid
        # near that condensed value for a short calibration relaxation. The orthohexagonal lattice
        # spreads the lipids uniformly (six equidistant neighbors) so this dense APL grids without the
        # square-lattice close contacts that made VMD mis-bond and psfgen guess atoms to the origin.
        # Only the starting guess -- the final grid is sized from the *measured* preferred APL.
        SAPL: 50.0
        salt_con: 0.154
        cation: POT
        anion: CLA
        composition:
          # Both leaflets are cholesterol-rich (43-47% CHL1) with saturated lipids (PSM, SOPE) -- a
          # liquid-ordered (Lo) raft composition, the membrane HIV Env actually sits in. Declaring Lo
          # packs each leaflet from an ordered (trans-biased) conformer ensemble so the calibration
          # settles in-phase instead of slowly ordering off a fluid start (the non-converging drift).
          upper_leaflet_phase: Lo
          lower_leaflet_phase: Lo
          lower_leaflet:
            - name: POPE
              frac: 0.09
            - name: SOPS
              frac: 0.18
            - name: SOPE
              frac: 0.30
            - name: CHL1
              frac: 0.43
          upper_leaflet:
            - name: PSM
              frac: 0.36
            - name: POPC
              frac: 0.17
            - name: CHL1
              frac: 0.47
        seed: 270272
        relaxation_protocols:
          # asymmetric grid: the patch protocol relaxes the two symmetric calibration patches (one per
          # leaflet composition), the quilt protocol relaxes the gridded membrane. The barostatted
          # relaxation is done entirely by the self-terminating, chunked membrane_equilibrate task; the
          # bare md stages only minimize and warm the fresh grid.
          patch:
            - md:
                ensemble: minimize
            # brief hot NVT: melt the lipids off the initial grid lattice (and start the
            # cholesterol-rich leaflets ordering), then settle at the target temperature
            - md:
                ensemble: NVT
                nsteps: 2000
                temperature: 410
            - md:
                ensemble: NVT
                nsteps: 2000
                temperature: 310
            # calibration APL must converge -- it sizes the whole grid. The two-stage
            # membrane_equilibrate settles density at constant lateral area then relaxes the tensionless
            # area. With the head-anchored packing (near-correct density, no voids) this needs no
            # high-pressure NPT condensation ladder -- that was compensating for the old gappy, under-
            # dense packing. Gate on the cumulative area PLATEAU (area_plateau_tol 0.005), not just the
            # local slope: a cholesterol-rich leaflet's area creeps slowly, so the default local gate
            # would stop while a systematic descent continues -- and the grid-sizing reliability check
            # (_AREA_CONVERGENCE_TOL 0.005, the same metric) would then reject the calibrated APL. The
            # larger max_steps ceiling covers the slow cholesterol relaxation.
            - membrane_equilibrate:
                temperature: 310
                pressure: 1.0
                area_plateau_tol: 0.005
                max_steps: 800000
                # the calibration patch has no protein and no preferred aspect; on the orthohexagonal
                # (non-square) box, locking Lx:Ly makes the tensionless stage over-condense along the
                # short axis instead of settling.  Let the flexible cell relax x and y independently.
                constant_ratio: false
          # The asymmetric quilt is gridded ~15% loose (placement clearance for the rigid,
          # cholesterol-rich leaflets); a self-terminating two-stage membrane_equilibrate replaces the
          # fixed NPT-condense + NPgT ladder. Stage 1 settles density at constant lateral area (excess
          # z-void leaves from z only), then stage 2 relaxes the ~15%-loose lateral area down to the
          # per-leaflet preferred APL under tensionless NPgT, stopping when both density and the lateral
          # area have converged. A larger max_steps than the default covers the bigger loose-build
          # contraction.
          quilt:
            - md:
                ensemble: minimize
            - md:
                ensemble: NVT
                nsteps: 1000
                temperature: 310
            - membrane_equilibrate:
                temperature: 310
                max_steps: 800000
      embed:
        xydist: 40
        zdist: 10
        z_head_group: "protein and resid 667"
        z_tail_group: "protein and resid 710"
        z_ref_group: 
          text: "protein and resid 696"
          z_value: 0.0
  - md:
      ensemble: minimize
      minimize: 1000
      constraints:
        k: 10
        atoms: protein and name CA
  - ring_check:  # there are sterols (cholesterol rings are lipid rings)
      segtypes: [lipid, glycan]
  - validate:
      tests:
        - residue_test:
            name: test of protein presence
            selection: protein
            measure: residue_count
            relation: '>='
            value: 1
  # --- post-embed equilibration ---
  # A brief warm pass fluidizes the lipids around the freshly-embedded protein; a
  # self-terminating two-stage membrane_equilibrate then condenses out the embedding
  # voids (stage 1, constant lateral area) and relaxes the lateral area at zero tension
  # (stage 2, tensionless NPgT), stopping once both the box density and the lateral area
  # have converged -- replacing the old fixed NPT-condense + NPgT-area ladder. Weak CA
  # restraints hold the protein steady while the box relaxes and are released only on the
  # final stage, on which the pressure profile is computed.
  - md:
      ensemble: NVT
      nsteps: 1000
      temperature: 410
      constraints:
        k: 10
        atoms: protein and name CA
  - md:
      ensemble: NVT
      nsteps: 4000
      temperature: 310
      constraints:
        k: 1
        atoms: protein and name CA
  # A single self-terminating membrane_equilibrate replaces the restrained NPT-condense +
  # NPgT-area-relax ladder: chunked, two-stage (const-area density then tensionless area),
  # sized so the condensing cell never outruns NAMD's startup patch grid, stopping when the
  # box density AND the membrane lateral area have both converged. Larger ceiling than the
  # schema default: embedding perturbs the preferred area, so density (fast) and the slow
  # lipid area mode relax sequentially and the area tail needs several 100k steps.
  - membrane_equilibrate:
      temperature: 310
      max_steps: 800000
      constraints:
        k: 1
        atoms: protein and name CA
  - md:
      # final, unrestrained NPgT stage -- ~256 ps to let the lateral area plateau;
      # the pressure profile is sampled only here, on the equilibrated cell
      ensemble: NPgT
      nsteps: 128000
      temperature: 310
      other_parameters:
        pressureProfile: on
        pressureProfileFreq: 100
        pressureProfileSlabs: 20
  - mdplot:
      timeseries:
        - [cpu_time, wall_time]
        - density
        - [a_x, b_y, c_z]
      profiles:
        - pressure
      basename: bilayer
  - terminate:
      basename: my_6e8w
      package:
        basename: prod_6e8w
        namd:
          ensemble: NPgT
          firsttimestep: 0
          dcdfreq: 10000
          xstfreq: 10000
          outputenergies: 1000
          nsteps: 10000000
          other_parameters:
            pressureProfile: on
            pressureProfileFreq: 10000
            pressureProfileSlabs: 20
